<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIMI Analytics</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Ir para o conteúdo</a>
  <noscript>O painel WIMI Analytics precisa de JavaScript habilitado.</noscript>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true">W</span>
        <div>
          <strong>WIMI</strong>
          <span>Operações</span>
        </div>
      </div>
      <nav class="primary-nav">
        <button type="button" data-route="overview">Visão geral</button>
        <button type="button" data-route="cameras">Câmeras</button>
        <button type="button" data-route="analytics">Analytics</button>
        <button type="button" data-route="computers"><span>Computadores</span><span class="nav-state">Pendente</span></button>
        <button type="button" data-route="network">Rede</button>
        <button type="button" data-route="timeline">Ocorrências</button>
        <button type="button" data-route="reports">Relatórios</button>
        <button type="button" data-route="system">Sistema</button>
      </nav>
      <div class="sidebar-status">
        <span id="connection-dot" class="status-dot pending" aria-hidden="true"></span>
        <div>
          <strong id="connection-label">Conectando</strong>
          <span id="last-update">Sem coleta</span>
        </div>
      </div>
    </aside>

    <main id="workspace" class="workspace" tabindex="-1">
      <header class="topbar">
        <div>
          <p class="eyebrow">Wimifarma · Operação local</p>
          <h1 id="page-title">Visão geral</h1>
        </div>
        <div class="topbar-actions">
          <span id="topbar-update" class="topbar-update">NVR sem coleta</span>
          <span id="service-badge" class="status-badge pending">Verificando</span>
          <button id="refresh-button" class="icon-button" type="button" title="Atualizar dados" aria-label="Atualizar dados">↻</button>
        </div>
      </header>
      <section id="content" class="content" aria-live="polite" aria-busy="true">
        <div class="loading-state">Carregando estado operacional...</div>
      </section>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
